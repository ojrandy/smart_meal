# Flutter gen-l10n: UI text lives in lib/core/l10n/app_<lang>.arb.
# app_en.arb is the template (every key and its description); app_fr.arb
# must have the same keys. Generated Dart goes next to the ARB files.
arb-dir: lib/core/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
required-resource-attributes: true
