name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: no job here needs to write to the repo.
permissions:
  contents: read

# A newer push to the same PR/branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The single place the Flutter version is pinned. Keep in sync with README.
  FLUTTER_VERSION: '3.35.7'
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  verify:
    name: Format, analyze, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      # Same steps, same order as the local gate.
      - name: Quality gate (tool/verify.sh)
        run: bash tool/verify.sh

      - name: Compile smoke test (debug APK)
        run: flutter build apk --debug

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, not just the tip
          persist-credentials: false

      # Official release binary, verified against a pinned checksum rather
      # than trusting a mutable action tag.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLo "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Scan
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose

  dependencies:
    name: Dependency vulnerabilities (OSV-Scanner)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Non-blocking while the baseline is triaged. Becomes blocking on
    # 2026-11-14: delete this line then (tracked in docs/prompt-tracker.md).
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=./pubspec.lock
