# Analyzer configuration. CI runs `flutter analyze --fatal-infos
# --fatal-warnings`, so every lint below blocks a merge. Rationale for the
# stricter-than-default set: context/code-standard.md → "Formatting & analysis".

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - avoid_print
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
    - prefer_single_quotes
    - prefer_const_constructors
    - prefer_const_declarations
    - always_declare_return_types
    - avoid_dynamic_calls
